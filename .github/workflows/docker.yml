name: CI CD Pipeline
on:
  push: 
    branches:
      - main  
jobs:   
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./doker/Dockerfile.turbo
          push: true
          tags:  ${{ secrets.DOCKERHUB_USERNAME }}/ollama-farmer:${{github.sha}}

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{secrets.VM_HOST}}
          username: ${{secrets.VM_USERNAME}}
          key: ${{secrets.VM_SSH_KEY}} 
          script: |
            docker pull ${{secrets.DOCKERHUB_USERNAME}}/ollama-farmer:${{github.sha}}
            docker stop ollama-farmer || ture
            docker rrm ollama-farmer || true

            docker run -d --name ollama-farmer --restart unless-stopped -p 3001:3001 -p 3000:3000 -e TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" ${{ secrets.DOCKERHUB_USERNAME }}/ollama-farmer:${{github.sha}}
            docker image prune -f
        